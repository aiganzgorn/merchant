<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Торговец</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0f16; overflow: hidden; }
      body { display: flex; flex-direction: column; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cdd6ff; }
      #map { display: block; flex: 0 0 auto; cursor: grab; touch-action: none; }
      #map.drag { cursor: grabbing; }
      #hud {
        position: fixed; top: 10px; left: 12px; pointer-events: none; user-select: none;
        color: #8f9ac4; text-shadow: 0 1px 2px rgba(0,0,0,.9);
      }
      #hud b { color: #ffd76e; font-weight: 600; }
      /* fixed widths: the HUD sits in a fixed row, so a wider value must not shove its neighbours */
      #zoom, #tile, #clock { display: inline-block; }
      #zoom { min-width: 9ch; }
      #tile { min-width: 12ch; }
      #clock { min-width: 13ch; }
      .hud-btn {
        pointer-events: auto;
        background: rgba(13,15,22,.85);
        border: 1px solid rgba(140,160,220,.35);
        color: #cdd6ff;
        font: inherit;
        padding: 1px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      .hud-btn[aria-pressed="true"] {
        background: rgba(140,160,220,.25);
        border-color: rgba(140,160,220,.65);
        color: #fff;
      }
      #strip {
        flex: 0 0 var(--strip, 220px); height: var(--strip, 220px);
        display: flex; border-top: 1px solid rgba(140,160,220,.2);
        background: rgba(13,15,22,.96);
      }
      #strip > section { display: flex; flex-direction: column; min-width: 0; padding: 10px 14px; }
      /* the feed grows all game long: scroll it, and never squash a row into a sliver */
      #feed { flex: 1 1 58%; border-right: 1px solid rgba(140,160,220,.18); overflow-y: auto; }
      #feed .row, #deals .row { flex: 0 0 auto; }
      #deals { flex: 1 1 42%; overflow-y: auto; }   /* the town card can outgrow the strip */
      .head { color: #ffd76e; font-size: 14px; margin-bottom: 6px; }
      .row { color: #8f9ac4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* the price list is long: wrap it instead of clipping, two lines fit the strip */
      .row.market { white-space: normal; line-height: 1.45; }
      .row b { color: #cdd6ff; font-weight: 600; }
      .note { color: #59618a; margin-top: auto; }
      /* market prices and roads are clickable in the deals card */
      .buy, .go, .sell-all {
        font: inherit; color: #cdd6ff; cursor: pointer;
        background: rgba(140,160,220,.12); border: 1px solid rgba(140,160,220,.3);
        border-radius: 4px; padding: 1px 6px; margin: 2px 2px 0 0;
      }
      .buy:hover, .go:hover, .sell-all:hover { background: rgba(255,215,110,.18); border-color: rgba(255,215,110,.55); }
      .buy:disabled, .go:disabled { opacity: .4; cursor: default; }
      .sell-all { margin-top: 4px; }
      #start {
        position: fixed; inset: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center;
        background: rgba(6,8,13,.78);
      }
      #start[hidden] { display: none; }
      #start .panel {
        width: min(720px, 92vw); max-height: 80vh; overflow: auto;
        padding: 18px 20px; border-radius: 8px;
        background: rgba(13,15,22,.97); border: 1px solid rgba(140,160,220,.35);
      }
      #start .panel h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; color: #ffd76e; }
      #start .hint { margin-bottom: 12px; color: #59618a; }
      #start-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px; }
      .start-item {
        display: block; text-align: left; font: inherit; cursor: pointer;
        padding: 6px 10px; border-radius: 6px; color: #cdd6ff;
        background: rgba(140,160,220,.08); border: 1px solid rgba(140,160,220,.25);
      }
      .start-item:hover, .start-item:focus-visible {
        background: rgba(140,160,220,.2); border-color: rgba(140,160,220,.6);
      }
      .start-item b { color: #fff; font-weight: 600; }
      .start-item .meta { margin-left: 8px; color: #8f9ac4; }
      .start-item .res { display: block; color: #59618a; }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="hud"><b id="seed">seed 1</b> · <span id="zoom">zoom —</span> · <span id="tile">тайл —</span> · <span id="clock">день 1 · ×1</span> · <button id="zones" class="hud-btn" aria-pressed="true" type="button">зоны</button> · <button class="hud-btn speed-btn" data-speed="0" aria-pressed="false" type="button">‖</button> <button class="hud-btn speed-btn" data-speed="1" aria-pressed="true" type="button">×1</button> <button class="hud-btn speed-btn" data-speed="2" aria-pressed="false" type="button">×2</button> <button class="hud-btn speed-btn" data-speed="4" aria-pressed="false" type="button">×4</button></div>
    <div id="start">
      <div class="panel">
        <h1>Куда едем?</h1>
        <div class="hint">выбери город, с которого начнёшь дело — карта подстроится под него</div>
        <div id="start-list"></div>
      </div>
    </div>
    <div id="strip">
      <section id="feed">
        <div class="head">лента</div>
        <div class="row"><b>мир</b> карта собрана, события ещё не идут</div>
        <div class="note">события появятся, когда мир начнёт жить</div>
      </section>
      <section id="deals">
        <div class="head">мои дела</div>
        <div id="deals-body"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
